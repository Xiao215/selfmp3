# Packaging the shell.
#
# `files` names `dist/**` and `package.json` and nothing else, and there are no
# runtime `dependencies` to collect — esbuild put everything but `electron` into
# `dist/`. That is what sidesteps electron-builder's trouble with packages npm
# has hoisted to the root of a workspace (electron-builder #2205, #9654).
#
# Signing has three tiers, and which one a build gets is decided by the
# environment rather than by a flag here (see scripts/signingTier.mjs):
#
#   signed       CSC_LINK and CSC_KEY_PASSWORD are set, and notarised when the
#                APPLE_API_* variables are too. Opens with a double click.
#   development  CSC_NAME names a certificate in this Mac's keychain, such as
#                the free Apple Development one. Still needs Open Anyway, but
#                the keychain knows every such build as the same app.
#   ad-hoc       nothing is set. `identity: "-"`, the looser entitlements, and a
#                first launch that needs Privacy & Security › Open Anyway.
#
# The ad-hoc tier is the one Xiao builds on their own Mac for their own Mac, and
# it is a real tier rather than a failure: the app it produces is the same app.
appId: com.selfmp3.app
productName: self.mp3
copyright: Xiao

directories:
  output: release
  buildResources: build

files:
  - dist/**
  - package.json

# The shell has no native modules, so nothing is rebuilt for Electron's ABI and
# asar needs no unpacking.
npmRebuild: false
asar: true

# `resources/icon.png` at 1024, rendered from the SVG the tab and the phone wear
# by `scripts/icon.mjs`. electron-builder makes the .icns and the .ico from it.
icon: resources/icon.png

mac:
  category: public.app-category.music
  # Both architectures are built, and without the arch in every name the Intel
  # one was `self.mp3-1.0.0.dmg` beside `self.mp3-1.0.0-arm64.dmg` — and the one
  # installed on an M1 was the Intel one, running under Rosetta.
  artifactName: '${productName}-${version}-${arch}.${ext}'
  # macOS 13, as the Stack table says: Electron 44's own floor.
  minimumSystemVersion: '13.0'
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # What a release has: both chips, and the zips electron-updater installs
  # from. A build on your own Mac is narrowed to one dmg for that Mac by
  # scripts/dist.mjs.
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]

dmg:
  # The mounted volume's name, with the architecture: two of these open at
  # once were both "self.mp3 1.0.0".
  title: '${productName} ${version} (${arch})'
  # The window everyone knows: the app on the left, Applications on the right.
  # `scripts/dmg-background.mjs` draws the background at 1× and 2× — the arrow in
  # it runs between these two positions, so they move together — and the window
  # takes its size from the 1× file.
  background: resources/dmg-background.png
  iconSize: 100
  iconTextSize: 13
  contents:
    - x: 140
      y: 190
      type: file
    - x: 400
      y: 190
      type: link
      path: /Applications

# Where electron-updater looks, and where a tagged build publishes. `publish`
# never runs by itself: the workflow attaches the files to the release.
publish:
  provider: github
  owner: Xiao215
  repo: selfmp3
  releaseType: release

# Present and deliberately not in any default build: nothing here reads
# `process.platform` to do something these could not, and nothing is tested on
# them. See "The desktop app" in docs/FEATURE_TODO.md.
win:
  target: nsis
linux:
  # Without this the executable is named from the npm package — `@selfmp3/desktop`
  # — and an AppImage refuses the `@` and the `/`. Here and not at the top: set
  # there, macOS takes it too, for the bundle as well as the binary, and the dmg
  # offered `selfmp3.app` instead of self.mp3.
  executableName: selfmp3
  target: AppImage
  category: AudioVideo
