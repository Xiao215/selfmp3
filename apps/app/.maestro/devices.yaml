# Phase 3 gate: devices and handoff, which the phone gains with the move.
#
# Run as:
#   maestro test .maestro/smoke.yaml .maestro/offline.yaml .maestro/devices.yaml
#
# Needs two devices on one Mac, which a one-device run cannot fake:
#   - this phone, connected to the Mac by address (onboarding), not signed in
#     to the cloud — presence travels through the Mac's event stream, so a
#     cloud-only phone is alone by design (progress log, question 5);
#   - another device playing against the same server, e.g. the web app open
#     in a browser with a song going.
#
# The sheet opens from the mini player, so the phone has to have a song loaded
# first. It is paused again before the handoff, because the sheet only offers
# to take over from a device that is playing while this one is not.
appId: com.selfmp3.app
---
- launchApp

# The app opens on Home (docs/UI-MIGRATION.md, Phase 2); Library is a tab.
- extendedWaitUntil:
    visible:
      id: 'home-screen'
    timeout: 60000
- tapOn:
    id: 'tab-library'

- extendedWaitUntil:
    visible:
      id: 'library-screen'
    timeout: 30000

- tapOn:
    id: 'song-row-0'
- extendedWaitUntil:
    visible:
      id: 'mini-player-playing'
    timeout: 15000
- tapOn:
    id: 'mini-player-playing'
- assertVisible:
    id: 'mini-player-paused'
# Remember what this phone had, so the handoff can be seen to replace it.
- copyTextFrom:
    text: 'Open now playing: .*'
- evalScript: ${output.before = maestro.copiedText}

# --- the list ----------------------------------------------------------------
# Devices is under Now Playing's ⋯, and the mini player opens Now Playing.
- tapOn:
    id: 'mini-player'
- tapOn:
    id: 'now-playing-more'
- tapOn: 'Devices'
- assertVisible:
    id: 'devices-sheet'
- assertVisible: 'this device'
# The other device, found over the stream or the polling fallback.
- extendedWaitUntil:
    visible: '.*Playing now.*'
    timeout: 20000

# --- handoff -----------------------------------------------------------------
# Tapping a playing device pulls its queue and position here and pauses it
# there. Playing is not enough to pass: resuming this phone's own song would
# also be playing, so the song must have changed too.
#
# Two things this cannot see, which whoever runs it checks against the
# server's device list (GET /api/devices): that the other device paused, and
# that this phone started near the position the other one had reached rather
# than at the top of the song.
- tapOn: '.*Playing now.*'
- extendedWaitUntil:
    visible:
      id: 'mini-player-playing'
    timeout: 15000
- copyTextFrom:
    text: 'Open now playing: .*'
- assertTrue: ${maestro.copiedText != output.before}
