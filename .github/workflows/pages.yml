# The universal app (apps/app) on its own, with no Mac behind it, published to
# GitHub Pages (docs/SYNC.md): https://<owner>.github.io/<repo>/.
#
# It signs in through the doorman named by DEFAULT_DOORMAN_URL in
# packages/shared/src/cloud.ts, or by the repository variable DOORMAN_URL if
# one is set (Settings → Secrets and variables → Actions → Variables).
name: Pages

on:
  push:
    branches: [main]
    paths:
      - apps/app/**
      - packages/**
      - package-lock.json
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions: {}

# One deployment at a time. A newer push waits rather than cancelling one
# that is half published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Nothing is published that does not typecheck, lint and pass its tests.
  # Spelled out rather than inherited, because this workflow grants nothing by
  # default and a called workflow gets no more than its caller allows.
  check:
    permissions:
      contents: read
    uses: ./.github/workflows/check.yml

  build:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only what building needs: the build runs the dependencies' code, so it
    # gets no say over what is published.
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          # One Node version for the whole repository, in .nvmrc; `engines` in
          # package.json says the same thing to anyone installing by hand.
          node-version-file: .nvmrc
          cache: npm

      # No install scripts: exporting for the web needs none of them. The
      # native modules are the server's and the phone build's.
      - run: npm ci --ignore-scripts

      - id: pages
        uses: actions/configure-pages@v6

      - name: Build the web app
        run: |
          npm run build:packages
          npm run export:web --workspace @selfmp3/app
        env:
          # Pages serves from /<repo>; app.config.js turns this into Expo's baseUrl.
          EXPO_PUBLIC_BASE: ${{ steps.pages.outputs.base_path }}
          SELFMP3_DOORMAN_URL: ${{ vars.DOORMAN_URL }}

      # Pages answers a path it has no file for with 404.html. Make that the
      # app itself, so a link straight to a page like /selfmp3/settings opens.
      - run: cp apps/app/dist/index.html apps/app/dist/404.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
