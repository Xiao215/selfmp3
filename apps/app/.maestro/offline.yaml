# Phase 3 gate: a downloaded song plays with the Mac out of reach.
#
# Run as:
#   maestro test .maestro/smoke.yaml .maestro/offline.yaml .maestro/devices.yaml
#
# Run it through offline-run.sh, not on its own. The plan says airplane mode,
# which the iOS simulator does not have, and a test-only switch inside the app
# would prove the switch rather than the player: track-player fetches its own
# URLs, so only a server that genuinely does not answer shows whether a song
# is coming from disk. offline-run.sh freezes the Mac's server for the length
# of the run and always resumes it — to the phone, a Mac that has gone to
# sleep, which is the ordinary way a phone away from home loses it.
#
# Needs a phone connected to that Mac by address with at least one song
# downloaded; smoke.yaml downloads a playlist on the way through.
#
# Not asserted, because it does not exist: the plan's "an undownloaded song
# says so instead of failing". The web app refuses to start it and says why;
# the phone starts it, and it sits paused with no word. That is a visible
# change, so it is a question for Xiao, not a fix here.
appId: com.selfmp3.app
---
- launchApp

# The app opens on Home (docs/UI-MIGRATION.md, Phase 2); Library is a tab.
- extendedWaitUntil:
    visible:
      id: 'home-screen'
    timeout: 90000
- tapOn:
    id: 'tab-library'

# The library is the cached copy, which shows once the request has timed out
# and been retried once: about half a minute.
- extendedWaitUntil:
    visible:
      id: 'song-row-0'
    timeout: 90000

- tapOn:
    id: 'library-on-this-phone'
- tapOn:
    id: 'song-row-0'
- extendedWaitUntil:
    visible:
      id: 'mini-player-playing'
    timeout: 15000

# Still playing a few seconds on, rather than a moment's state before a load
# that fails. Maestro has no sleep; a wait that is expected to time out is one.
- extendedWaitUntil:
    notVisible:
      id: 'mini-player-playing'
    timeout: 8000
    optional: true
- assertVisible:
    id: 'mini-player-playing'
