<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!--
      Expo's own template (node_modules/@expo/cli/static/template/index.html),
      kept here so the page can carry what the app's JavaScript cannot: a link
      to the privacy policy that a crawler reads without running the app.
      Google's OAuth verification looks for one on the home page. The policy
      itself is public/privacy.html, served beside this page.
    -->
    <link rel="privacy-policy" href="privacy.html" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Under the app, for whoever reads the page without it: the crawler, or no JavaScript. */
      #foot {
        padding: 16px 20px;
        font:
          13px/1.5 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          system-ui,
          sans-serif;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
    <footer id="foot">self.mp3 · <a href="privacy.html">Privacy policy</a></footer>
  </body>
</html>
