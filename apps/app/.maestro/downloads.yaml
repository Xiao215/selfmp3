# A song that is not on the phone, with streaming off, says why
# instead of loading and sitting paused.
#
# The design (docs/features/offline-sync.md): two
# settings, "Download automatically on Wi-Fi" and "Play songs that aren't
# downloaded". With both off, a song removed by hand stays removed and cannot
# play, and tapping it explains.
#
# Puts streaming back on at the end, so the other flows find the phone as
# they expect it. Wi-Fi downloads stay off, which is where a phone starts.
appId: com.selfmp3.app
---
- launchApp

# The app opens on Home; Library is a tab.
- extendedWaitUntil:
    visible:
      id: 'home-screen'
    timeout: 60000
- tapOn:
    id: 'tab-library'

- extendedWaitUntil:
    visible:
      id: 'song-row-0'
    timeout: 60000
- runFlow: close-guide.yaml

# --- both settings off ---------------------------------------------------------
# Settings is under Profile, which is the avatar on Home.
- tapOn:
    id: 'tab-home'
- tapOn:
    id: 'home-you'
- tapOn:
    id: 'profile-settings'
- scrollUntilVisible:
    element:
      id: 'setting-stream'
    direction: DOWN
# Off already on a phone nobody has turned it on for.
- runFlow:
    when:
      visible: 'New songs, by themselves'
    commands:
      - tapOn:
          id: 'setting-auto-download'
- tapOn:
    id: 'setting-stream'

# --- a song that is not here -------------------------------------------------------
- tapOn:
    id: 'tab-library'
- runFlow: close-guide.yaml
- tapOn: 'More actions for .*'
- extendedWaitUntil:
    visible: 'Add to Up next'
    timeout: 5000
- runFlow:
    when:
      visible: 'Remove download'
    commands:
      - tapOn: 'Remove download'
- runFlow:
    when:
      visible: 'Download'
    commands:
      - tapOn: 'Add to Up next'

- tapOn:
    id: 'song-row-0'
- extendedWaitUntil:
    visible: '.*isn’t downloaded.*'
    timeout: 5000
- assertVisible: 'Not now'
- tapOn: 'Not now'

# --- back as it was ------------------------------------------------------------------
- tapOn:
    id: 'tab-home'
- tapOn:
    id: 'home-you'
- tapOn:
    id: 'profile-settings'
- scrollUntilVisible:
    element:
      id: 'setting-stream'
    direction: DOWN
- tapOn:
    id: 'setting-stream'
