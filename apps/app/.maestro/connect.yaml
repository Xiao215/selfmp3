# Connecting a signed-out phone to a server by its address, the way every other
# flow here expects the phone to be set up (README.md).
#
# Run as:
#   maestro test -e SERVER=192.168.1.20:4600 .maestro/connect.yaml
#
# Development builds only: Welcome draws the address form behind a quiet text
# action there, and nowhere in a normal build. Connecting goes straight to Home;
# First sync follows a Google sign-in, never an address.
appId: com.selfmp3.app
---
- launchApp
- openLink: 'selfmp3://welcome'
# A simulator that has not followed this link before asks first, and can ask
# again as the app comes up.
- repeat:
    times: 3
    commands:
      - runFlow:
          when:
            visible: 'Open in .*'
          commands:
            - tapOn: 'Open'
            - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'welcome-google'
    timeout: 60000
- tapOn:
    id: 'welcome-address-toggle'
- tapOn:
    id: 'welcome-address'
# The keyboard's first appearance can swallow what is typed while it rises.
- waitForAnimationToEnd
# Whatever an earlier try left in the field goes first.
- eraseText: 60
- inputText: ${SERVER}
# Submitted from the keyboard, which covers Connect on a phone: Return moves on
# to the token field, and Return there connects. (Hiding the keyboard instead
# taps outside it, which can land on Continue with Google.)
- pressKey: Enter
- pressKey: Enter
# If the last Return only put the keyboard away, Connect is in view now.
- runFlow:
    when:
      visible:
        id: 'welcome-connect'
    commands:
      - tapOn:
          id: 'welcome-connect'
- extendedWaitUntil:
    visible:
      id: 'home-screen'
    timeout: 30000
