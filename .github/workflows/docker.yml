# The server image, for a Raspberry Pi (arm64) and anything else (amd64).
#
# Built on every push to main that could change it, and on demand. Published to
# ghcr.io/<owner>/selfmp3 as `latest` and as the commit's short hash, so a Pi
# runs `docker compose pull` rather than building anything itself.
#
# Each architecture is built on a runner of its own kind and pushed by digest;
# a last job ties the two digests together under the tags. The alternative —
# one job building both through QEMU — is what this replaced: `better-sqlite3`
# has no musl prebuild and compiles from source, and emulated that took longer
# than the hour the job was given. It survived only while the layer cache held,
# so the first dependency change in months was the one that timed out. Native
# runners take minutes, and are free while this repository is public.
name: Docker

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions: {}

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Registry names must be lowercase; the owner here is not. `arch` is the
      # platform with the slash taken out, for cache scopes and artifact names,
      # neither of which may contain one.
      - id: name
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/selfmp3" >> "$GITHUB_OUTPUT"
          echo "arch=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"
        env:
          PLATFORM: ${{ matrix.platform }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No tags: each build pushes a digest, and the job below names them. A
      # tag written here would be one architecture claiming `latest` for both.
      # The cache is scoped per architecture, or the two overwrite each other.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ steps.name.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ steps.name.outputs.arch }}
          cache-to: type=gha,mode=max,scope=${{ steps.name.outputs.arch }}

      - name: Hand the digest to the merge
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          touch "${{ runner.temp }}/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ steps.name.outputs.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # The tags point at a manifest list, so `docker pull` on a Pi and on a VPS
  # each get their own architecture from the same name.
  manifest:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/selfmp3" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tie the digests together and tag them
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE}:latest" \
            --tag "${IMAGE}:${GITHUB_SHA}" \
            $(printf "${IMAGE}@sha256:%s " *)
        env:
          IMAGE: ${{ steps.name.outputs.image }}

      - name: Say what was published
        run: docker buildx imagetools inspect "${IMAGE}:${GITHUB_SHA}"
        env:
          IMAGE: ${{ steps.name.outputs.image }}
