# Typecheck, lint and tests, on every push and pull request.
#
# Also called by the Pages workflow before it builds, so nothing reaches the
# published web app without having passed here first. `workflow_call` is what
# makes that one definition rather than two that drift.
name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions: {}

# The usual pairing, with one deviation. The group is the workflow and the ref
# rather than a hard-coded name, and cancelling is for pull requests only:
# every commit that lands on main is verified rather than superseded, and the
# run Pages starts by calling this one no longer cancels the run the same push
# started. A hard-coded group did exactly that, on every push to main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          # One Node version for the whole repository, in .nvmrc; `engines` in
          # package.json says the same thing to anyone installing by hand.
          node-version-file: .nvmrc
          cache: npm

      # With install scripts, unlike the Pages build: better-sqlite3 is a
      # native module and the server's tests are the reason this job exists.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The three Playwright suites are in no other project's graph, so they
      # are checked on their own. `npm run check` does the same.
      - name: Typecheck the verify suites
        run: npm run typecheck:verify

      - name: Lint
        run: npm run lint

      # Formatting is checked, never written, in CI: a job that reformats the
      # branch would push past the very drift this is here to catch.
      - name: Formatting
        run: npm run format:check

      # Twin-aware, because `x.ts` and `x.web.ts` declare the same names and
      # each makes the other look read. See the script.
      - name: Unused exports
        run: npm run check:exports

      - name: Test
        run: npm run test

      - name: Check the app
        run: npm run check:app
