<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!--
      Expo's own template (node_modules/@expo/cli/static/template/index.html),
      kept here so the page can carry what the app's JavaScript cannot: a link
      to the privacy policy that a crawler reads without running the app.
      Google's OAuth verification looks for one on the home page. The policy
      itself is public/privacy.html, served beside this page.
    -->
    <link rel="privacy-policy" href="privacy.html" />
    <!--
      What a chat app draws when someone pastes the app's address: a card with
      the name, the line from manifest.webmanifest and the icon. The picture's
      address has to be whole, so it names the Pages site, as DEFAULT_APP_URL in
      packages/shared/src/cloud.ts does. A share link's own card comes from the
      doorman (apps/doorman/src/linkPage.ts): Pages answers a link's address
      with a 404, which a chat app does not read.
    -->
    <meta name="description" content="Your own music library. Private, offline, yours." />
    <meta name="theme-color" content="#0c0b10" />
    <meta property="og:site_name" content="self.mp3" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="self.mp3" />
    <meta property="og:description" content="Your own music library. Private, offline, yours." />
    <meta property="og:image" content="https://xiao215.github.io/selfmp3/icons/icon-512.png" />
    <meta property="og:image:alt" content="self.mp3" />
    <meta name="twitter:card" content="summary" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Under the app, for whoever reads the page without it: the crawler, or no JavaScript. */
      #foot {
        padding: 16px 20px;
        font:
          13px/1.5 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          system-ui,
          sans-serif;
      }
      /*
       * Once the app is drawn the footer is still there for a crawler or a
       * screen reader, but takes no room: under the app it was the only thing
       * past the bottom of the window, so a focus deep in a list (tabbing down
       * Up next) scrolled the whole page up by its height and showed it under
       * the player bar. `overflow: hidden` on the body stops a person
       * scrolling, not the browser bringing a focused row into view.
       */
      #root:not(:empty) ~ #foot {
        position: absolute;
        top: 0;
        left: 0;
        width: 1px;
        height: 1px;
        padding: 0;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      /*
       * Still a Tab stop, so it shows itself while it has focus, as a skip
       * link does: a keyboard that reached it had a ring round nothing.
       */
      #root:not(:empty) ~ #foot:focus-within {
        position: fixed;
        top: 8px;
        left: 8px;
        z-index: 2147483647;
        width: auto;
        height: auto;
        padding: 8px 12px;
        overflow: visible;
        clip-path: none;
        border-radius: 8px;
        background: Canvas;
        color: CanvasText;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
    <footer id="foot">self.mp3 · <a href="privacy.html">Privacy policy</a></footer>
  </body>
</html>
