# The doorman: a Cloudflare Worker between your devices and your bucket.
# README.md in this folder says how to deploy it; docs/SYNC.md says why it exists.
#
# This repository is public. Nothing secret goes in this file: the three
# secrets are set with `npx wrangler secret put` (see below and README.md).

name = "selfmp3-doorman"
main = "src/index.ts"
compatibility_date = "2026-09-01"
# Only the workers.dev address serves the doorman. Preview addresses, one per
# uploaded version, would each be another way in to the same KV and secrets.
preview_urls = false

# @selfmp3/shared and @selfmp3/client are TypeScript that is built to dist/
# before anything can import them, so Wrangler builds them first, before every
# `dev` and `deploy` (the client's build builds shared, which it references).
# The doorman takes only the client's colour tokens (`@selfmp3/client/tokens`),
# for its pages. `wrangler dev` rebuilds when the doorman or either package
# changes.
[build]
command = "npm run build --workspace @selfmp3/client"
cwd = "../.."
watch_dir = ["src", "../../packages/shared/src", "../../packages/client/src/theme"]

[vars]
# The client ID of your OAuth client in the Google Cloud console. It is public:
# it appears in every Google sign-in link. See README.md.
GOOGLE_CLIENT_ID = "230606192127-sihrkjctjgcoittmcb15afkp4k2f72s0.apps.googleusercontent.com"
# The addresses the web app is served from. Browsers may call the doorman only
# from these, and a sign-in may send you back here (or to this computer, for the
# server's settings). The desktop app's and the browser extension's own origins
# are always allowed: they are the same on every install, and the doorman takes
# them from packages/shared/src/origins.ts.
APP_ORIGINS = "https://xiao215.github.io"

# Sign-ins waiting for their code, sessions, and each Google account's sealed
# bucket. Create the namespace with
#   npx wrangler kv namespace create KV
# and replace the id below with the one it prints.
[[kv_namespaces]]
binding = "KV"
id = "ac00b5cff3df480fabc0df100615d071"

# Each account's change counter (src/changes.ts), which lets a device skip
# listing the bucket when nothing has changed since it last did. A Durable
# Object: the free plan has them when they keep their storage in SQLite, as
# `new_sqlite_classes` says. Nothing to create by hand; `wrangler deploy` makes
# the class from the migration below the first time.
[[durable_objects.bindings]]
name = "CHANGES"
class_name = "Changes"

# Listening rooms (src/room.ts): one Durable Object per room code, holding the
# room and its members' WebSockets while it lasts, and nothing once it ends.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# Shared playlists (src/shared.ts): one Durable Object per playlist, kept
# until its last person leaves.
[[durable_objects.bindings]]
name = "SHARED"
class_name = "SharedPlaylist"

# Share links (src/share.ts): one Durable Object per link, kept until ninety
# days after it ends.
[[durable_objects.bindings]]
name = "SHARES"
class_name = "ShareLink"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Changes"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["SharedPlaylist"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["ShareLink"]

# Secrets, set once with `npx wrangler secret put <NAME>`, typing the value when asked:
#   GOOGLE_CLIENT_SECRET  the OAuth client's secret, from the Google Cloud console
#   SEAL_KEY              `openssl rand -base64 32`; every key the doorman uses comes from it
#   OWNER_EMAILS          your Google address (comma-separated for more): always let in, and the
#                         only ones who may change who else is, in self.mp3's Settings

# `npx wrangler dev --env dev`, on your own computer only: never deployed. The
# web app's local addresses may call it, and DEV lets it use a bucket on this
# computer over plain http (MinIO, say). Its KV is Wrangler's local stand-in.
# Wrangler hands an environment none of the top-level vars, so the client ID is
# named again here.
[env.dev.vars]
GOOGLE_CLIENT_ID = "230606192127-sihrkjctjgcoittmcb15afkp4k2f72s0.apps.googleusercontent.com"
APP_ORIGINS = "http://localhost:4600,http://localhost:4601"
DEV = "true"

[[env.dev.kv_namespaces]]
binding = "KV"
id = "local-dev-only"

[[env.dev.durable_objects.bindings]]
name = "CHANGES"
class_name = "Changes"

[[env.dev.durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[env.dev.durable_objects.bindings]]
name = "SHARED"
class_name = "SharedPlaylist"

[[env.dev.durable_objects.bindings]]
name = "SHARES"
class_name = "ShareLink"
