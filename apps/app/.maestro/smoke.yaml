# Phase 2 gate: the phone app's current feature set, after the move to apps/app.
#
# Run as:
#   maestro test .maestro/smoke.yaml   # play, next, mini player, sort, tag filter, menu, download
#
# SKELETON. The steps below are the flow the gate asks for, written against the
# screens phase 2 produces. They will fail until those screens exist with these
# testIDs — which is the point: the flow is written before the screens, so the
# screens are built to be testable rather than retro-fitted.
#
# Needs a configured server or a signed-in session; unlike the spike flows this
# one goes through the real app.
appId: com.selfmp3.app
---
- launchApp

# The app opens on Home (docs/UI-MIGRATION.md, Phase 2); Library is a tab.
- extendedWaitUntil:
    visible:
      id: 'home-screen'
    timeout: 60000
- tapOn:
    id: 'tab-library'

# --- library -----------------------------------------------------------------
# Waited for rather than asserted at once: a dev client fetches its bundle on
# launch, and after Metro restarts the cold bundle takes about 13 seconds.
- extendedWaitUntil:
    visible:
      id: 'library-screen'
    timeout: 60000

# The order is a sheet from the round button beside the title, and the list is
# headed by it (docs/ui-mock `P12`); the ✓ beside it starts choosing.
- tapOn:
    id: 'library-sort-phone'
- tapOn: 'Title'
- extendedWaitUntil:
    visible:
      id: 'library-order-label'
      text: 'Title'
    timeout: 5000
- tapOn:
    id: 'library-sort-phone'
- tapOn: 'Recently added'
- extendedWaitUntil:
    visible:
      id: 'library-order-label'
      text: 'Recently added'
    timeout: 5000
- tapOn:
    id: 'library-select-phone'
- assertVisible: 'Select .*'
- tapOn:
    id: 'library-select-phone'
- assertNotVisible: 'Deselect .*'

# Tap a row: it plays, the row tints, and the mini player picks it up.
- tapOn:
    id: 'song-row-0'
- assertVisible:
    id: 'mini-player'
- assertVisible:
    id: 'mini-player-playing'

# --- transport ---------------------------------------------------------------
# Next from the mini player moves the same queue every surface is showing.
- tapOn:
    id: 'mini-player-next'
- assertVisible:
    id: 'mini-player-playing'

# --- up next -----------------------------------------------------------------
# The mini player's queue button opens Up next as a sheet over the mini player
# and the tab bar (docs/ui-mock `P25`). Asserted by its Clear button rather
# than the `queue-sheet` id on its container, which is unreliable for the
# visibility check (see the song menu below). The grabber closes it again.
- tapOn:
    id: 'mini-player-queue'
- extendedWaitUntil:
    visible: 'Clear Up next'
    timeout: 5000
- tapOn:
    id: 'queue-sheet-close'
- assertVisible:
    id: 'mini-player-playing'

# --- selection ---------------------------------------------------------------
# Holding a row selects it; there is no Select button on a phone.
- longPressOn:
    id: 'song-row-0'
- extendedWaitUntil:
    visible: '1 selected'
    timeout: 5000
- tapOn:
    id: 'selection-done'

# --- a row's menu ------------------------------------------------------------
# On the row's ⋯, now that holding a row selects it.
- tapOn: 'More actions for .*'
# The menu is asserted by what is in it rather than by the `song-menu` id on
# its container: a sheet is a `Modal`, its own window on iOS, and container
# views inside it are unreliable for the visibility check. The items are not.
- extendedWaitUntil:
    visible: 'Add to queue'
    timeout: 5000
- tapOn: 'Add to queue'

# --- download ----------------------------------------------------------------
# Keeping one playlist on the phone is in its ⋯ (docs/UI-MIGRATION.md, Open
# question 5), not a button on the page.
- tapOn:
    id: 'tab-playlists'
- tapOn:
    id: 'playlist-row-0'
- tapOn:
    id: 'playlist-more'
# Download only what is not already here. A phone that has had this playlist
# for a while offers "Remove download" instead and has nothing to fetch, and a
# flow that insisted on Download would fail on the truest state there is.
- runFlow:
    when:
      visible: 'Download.*'
    commands:
      - tapOn: 'Download.*'
      - tapOn:
          id: 'playlist-more'
- extendedWaitUntil:
    visible: 'Remove download.*'
    timeout: 120000
