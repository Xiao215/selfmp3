# The self.mp3 server on an always-on computer (docs/INSTALL.md, "With Docker").
#
#   docker compose up -d
#   docker compose logs -f
#   docker compose pull && docker compose up -d           # update
#
# library/ and data/ next to this file are bind-mounted in, and a `.env` beside
# it, if there is one, is handed to the server (copy .env.example). Needs
# Docker Compose 2.24 or newer, for the optional env file.

name: selfmp3

services:
  selfmp3:
    # Built for arm64 (a Raspberry Pi) and amd64 by .github/workflows/docker.yml.
    # To build it on this machine instead: `docker compose build`.
    image: ghcr.io/xiao215/selfmp3:latest
    build: .
    container_name: selfmp3
    restart: unless-stopped
    # The host's own network rather than a published port. The server then sees
    # the computer's home and Tailscale addresses and publishes them for devices
    # to find it by; it can reach a helper on the host at 127.0.0.1 (the model
    # behind Smart features); and a firewall such as ufw still decides who gets
    # to port 4600, which a port Docker publishes would bypass. Docker Desktop
    # (Mac, Windows) has host networking off unless turned on in its settings;
    # there, replace this line with `ports: ['127.0.0.1:4600:4600']`.
    network_mode: host
    # The uid that owns library/ and data/ on the host. The image's own user is
    # 1000; a host account with another uid either puts its own here or runs
    # `sudo chown -R 1000:1000 library data` once.
    user: '1000:1000'
    env_file:
      - path: .env
        required: false
    environment:
      # The log's clock, and the days the server counts by. Set TZ in .env
      # (America/Toronto, Europe/London…); UTC otherwise.
      TZ: ${TZ:-Etc/UTC}
    volumes:
      - ./library:/app/library
      - ./data:/app/data
    # yt-dlp and ffmpeg are inside the image; nothing else to install.
