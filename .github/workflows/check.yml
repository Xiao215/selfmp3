# Typecheck, lint and tests, on every push and pull request.
#
# Also called by the Pages workflow before it builds, so nothing reaches the
# published web app without having passed here first. `workflow_call` is what
# makes that one definition rather than two that drift.
#
# The phone app is checked separately because it is not in the root TypeScript
# project — `npm run check` leaves it out, which is exactly how a rename of a
# shared export it alone uses can pass everything else and still break it.
name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions: {}

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # With install scripts, unlike the Pages build: better-sqlite3 is a
      # native module and the server's tests are the reason this job exists.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Check the phone app
        run: npm run check:mobile
