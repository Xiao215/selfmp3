# The wide layout on a touch screen: an iPad in portrait is past the breakpoint,
# so it has the sidebar and the player bar rather than tabs and a mini player,
# and smoke.yaml's phone steps do not apply.
#
# Run on an iPad simulator, connected the same way (connect.yaml):
#   maestro --device <iPad udid> test .maestro/tablet.yaml
appId: com.selfmp3.app
---
- launchApp
- extendedWaitUntil:
    visible:
      id: 'home-screen'
    timeout: 60000
- assertVisible:
    id: 'sidebar'

# A tile on Home opens its tag as a page. Home settles first: the week's card
# arrives after its numbers do and pushes the tiles down the page, and a tap
# aimed where a tile was lands under it.
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: 'home-tile-0'
- extendedWaitUntil:
    visible:
      id: 'place-name'
    timeout: 10000

# Library from the sidebar; a row plays, and the player bar has it.
- tapOn:
    id: 'nav-library'
- extendedWaitUntil:
    visible:
      id: 'library-screen'
    timeout: 30000
# A finger has no circle waiting in each row (docs/ui-mock `T09`): holding a
# row starts choosing, as on a phone.
- longPressOn:
    id: 'song-row-2'
- assertVisible:
    id: 'selection-done'
- tapOn:
    id: 'selection-done'
- assertNotVisible:
    id: 'selection-done'
- tapOn:
    id: 'song-row-0'
- assertVisible:
    id: 'player-bar'
- assertVisible: 'Pause'

# Up next is the rail beside the page, opened and closed from the bar.
- tapOn:
    id: 'player-bar-queue'
- assertVisible:
    id: 'queue-rail'
- tapOn:
    id: 'player-bar-queue'
- assertNotVisible:
    id: 'queue-rail'

# The bar's pause stops it.
- tapOn: 'Pause'
- assertVisible: 'Play'
